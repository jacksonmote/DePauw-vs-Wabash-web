name: Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bot-managed data files (series.json and the rest) live on the data branch, not on main. This is a
      # read-only fetch of this repository (the base repository, for a pull request from a fork), so it needs
      # no token and a fork gets no extra access. It fails the job if the branch or a file is missing.
      - name: Get the data files from the data branch
        run: python3 scraper/databranch.py fetch --remote origin

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --require-hashes -r requirements.txt

      # series.json on the data branch is only as new as the last data run; the rulings and the merge code in this
      # change may be newer. Rebuild it offline first (no fetching), so the tests and the render see what the
      # next data run will produce, and so a ruling that no longer finds its rows fails the pull request.
      - name: Re-merge series.json from the saved copies
        run: python scraper/scrape.py --remerge-only

      - name: Run tests
        run: python -m pytest -q tests

      - name: Render site
        run: python scraper/render.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the HTML validator from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check the title script syntax
        run: node --check static/easter-eggs.js

      - name: Validate generated HTML
        run: npx --no-install html-validate site/index.html site/404.html site/bell-heist/index.html site/heist-details/index.html site/privacy/index.html site/how-it-works/index.html site/how-it-works/athletics/index.html site/how-it-works/alumni/index.html site/alumni/index.html

      # Draws every mermaid block in README.md with the Mermaid CLI, so a diagram with a syntax error fails the
      # PR instead of showing an error box on GitHub. The CLI exits 0 when a file has no blocks, so the count
      # is checked first. The sandbox is off because Ubuntu 24.04 runners block Chrome's; the only input is
      # this repository's own README. Output goes to RUNNER_TEMP, never the repository.
      - name: Check README diagrams
        run: |
          blocks="$(grep -c '^```mermaid' README.md || true)"
          if [ "$blocks" -eq 0 ]; then
            echo "README.md has no mermaid blocks; the diagrams are gone or the fence changed."
            exit 1
          fi
          echo "Rendering $blocks diagram(s)."
          echo '{"args": ["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          npx --yes -p @mermaid-js/mermaid-cli@11.17.0 mmdc -p "$RUNNER_TEMP/puppeteer.json" -i README.md -o "$RUNNER_TEMP/readme-diagrams.md"

  # Runs the whole test suite with the clock frozen at a few moments, so a test that quietly depends on today's
  # date fails here in a pull request instead of blocking a production deploy later. time-machine fakes the clock
  # for the whole Python process (requirements-clock.txt pins it); the tests themselves never use the network.
  # Separate from the `checks` job on purpose: the required status check stays `checks`.
  fake-clock:
    name: fake-clock (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Bell game, Nov 14 2026 1:30 PM ET
            now: "2026-11-14T13:30:00-05:00"
          - label: New Year, Jan 1 2027 12:30 AM ET
            now: "2027-01-01T00:30:00-05:00"
          - label: a year out, Oct 30 2027 noon ET
            now: "2027-10-30T12:00:00-04:00"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bot-managed data files (series.json and the rest) live on the data branch, not on main. This is a
      # read-only fetch of this repository (the base repository, for a pull request from a fork), so it needs
      # no token and a fork gets no extra access. It fails the job if the branch or a file is missing.
      - name: Get the data files from the data branch
        run: python3 scraper/databranch.py fetch --remote origin

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --require-hashes -r requirements.txt -r requirements-clock.txt

      # series.json on the data branch is only as new as the last data run; the rulings and the merge code in this
      # change may be newer. Rebuild it offline first (no fetching), so the tests and the render see what the
      # next data run will produce, and so a ruling that no longer finds its rows fails the pull request.
      - name: Re-merge series.json from the saved copies
        run: python scraper/scrape.py --remerge-only

      - name: Run tests with the clock frozen
        run: python -m pytest -q tests --fake-now="${{ matrix.now }}"
