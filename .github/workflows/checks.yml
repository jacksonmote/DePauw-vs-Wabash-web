name: Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Render site
        run: python scraper/render.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Check the home-page script syntax
        run: node --check static/easter-eggs.js

      - name: Validate generated HTML
        run: npx --yes html-validate@11.17.0 site/index.html site/404.html site/bell-heist/index.html site/how-it-works/index.html site/how-it-works/athletics/index.html site/how-it-works/alumni/index.html site/alumni/index.html

      # Draws every mermaid block in README.md with the Mermaid CLI, so a diagram with a syntax error fails the
      # PR instead of showing an error box on GitHub. The CLI exits 0 when a file has no blocks, so the count
      # is checked first. The sandbox is off because Ubuntu 24.04 runners block Chrome's; the only input is
      # this repository's own README. Output goes to RUNNER_TEMP, never the repository.
      - name: Check README diagrams
        run: |
          blocks="$(grep -c '^```mermaid' README.md || true)"
          if [ "$blocks" -eq 0 ]; then
            echo "README.md has no mermaid blocks; the diagrams are gone or the fence changed."
            exit 1
          fi
          echo "Rendering $blocks diagram(s)."
          echo '{"args": ["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"
          npx --yes -p @mermaid-js/mermaid-cli@11.17.0 mmdc -p "$RUNNER_TEMP/puppeteer.json" -i README.md -o "$RUNNER_TEMP/readme-diagrams.md"
