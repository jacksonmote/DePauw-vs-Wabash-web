name: Update data and deploy site

on:
  schedule:
    # Twice a day (UTC): 5:19 AM and 10:47 PM Eastern in standard time (6:19 AM and 11:47 PM in daylight time).
    # GitHub often starts scheduled runs hours late (5 to 7 hours in late October 2026) or not at all, which is
    # why game days rely on the game-day watcher (gameday-watcher.yml) rather than on this schedule.
    - cron: "19 10 * * *"
    - cron: "47 3 * * *"
    # Game-day mode: every 30 minutes, at jittered minutes. The "gate" job below ends these runs at once
    # unless a DePauw vs. Wabash game is being played (see scraper/gameday.py), and also while the game-day
    # watcher is running (it already starts an update every 15 minutes). The string must match
    # FREQUENT_CRON in scraper/gameday.py; a test checks that.
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: "Accept a sport whose game count went down"
        type: boolean
        default: false
      apply_reviewed_changes:
        description: "Apply the changes to old games waiting for review (see the data-review issue)"
        type: boolean
        default: false
      test_data_commit:
        description: "Prove the push to the data branch works: commit only a marker file there (no real data)"
        type: boolean
        default: false
      gameday:
        description: "Game-day update: read only the sports playing today (the game-day watcher sets this; leave it unticked for a full update)"
        type: boolean
        default: false

permissions:
  contents: read

# Scrape, render and deploy live in one workflow on purpose: a commit pushed with GITHUB_TOKEN
# does not trigger other workflows, so a separate deploy workflow would never run.
#
# Concurrency is set on the jobs that change things (build, deploy), not on the whole workflow, so a
# frequent run that the gate ends at once never queues behind or replaces a waiting push or scheduled run.
# Nothing is ever cancelled once it is running.
#
# Where the data lives: main holds the code and the hand-curated data files (overrides, alumni, endowment,
# heists, fun facts); the files only this workflow writes (series, depauw, wabash, upcoming, pending-changes) live on the
# unprotected `data` branch, because the "Protect main" ruleset rejects the Actions bot. Every job that needs
# them runs `scraper/databranch.py fetch` first; only the build job pushes to that branch, and the build
# job's concurrency group keeps two runs from pushing at once (scraper/databranch.py explains the rest).

jobs:
  gate:
    # Decides whether this run does the real work and which sports it reads from the schools (scope). Only the
    # frequent game-day schedule can say no (outside a game-day window, or while the game-day watcher runs).
    # Scope: every sport for the two daily schedules and a hand-started manual run; only the sports playing today
    # for a game-day run (the frequent schedule inside a window, or a run the watcher started with gameday);
    # nothing for a push to main, unless the push changed the scraper or sources.json (gameday.SCRAPE_ON_PUSH).
    # Reads only the data files (fetched from the data branch) with the runner's own Python: no dependencies, no
    # scrape, no commit, no deploy. A fetch that fails fails the job; it never reads a missing schedule as "no games".
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read # to see whether a game-day watcher run is in progress
    outputs:
      run: ${{ steps.gate.outputs.run }}
      scope: ${{ steps.gate.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scraper

      - name: Get the data files from the data branch
        run: python3 scraper/databranch.py fetch --remote origin

      - name: Is the game-day watcher running?
        id: watcher
        if: ${{ github.event.schedule == '7,37 * * * *' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scraper/watcher.py running

      # A failed fetch (a first push, a rewritten history) leaves no list, and the gate then reads every sport.
      - name: Which files did this push change?
        if: ${{ github.event_name == 'push' }}
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if git fetch --quiet --no-tags --depth=1 origin "$BEFORE" "$AFTER"; then
            git diff --name-only "$BEFORE" "$AFTER" > "$RUNNER_TEMP/changed.txt"
            cat "$RUNNER_TEMP/changed.txt"
          else
            echo "Could not fetch the commits before and after the push; every sport will be read."
          fi

      - name: Is a game being played, and what does this run read?
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          GAMEDAY: ${{ inputs.gameday }}
          WATCHER_RUNNING: ${{ steps.watcher.outputs.running }}
        run: >-
          python3 scraper/gameday.py gate --schedule "$SCHEDULE" --event "$EVENT" --gameday "$GAMEDAY"
          --watcher-running "$WATCHER_RUNNING" --changed "$RUNNER_TEMP/changed.txt"

  watcher-handoff:
    # On a game day the two daily runs also start the game-day watcher (gameday-watcher.yml): one more chance for
    # it to start when GitHub drops its own scheduled runs. Its own job, so that only it holds actions: write, and
    # independent of the build, so a build that is queued or replaced never loses the hand-off. Reads only the
    # data branch; starts nothing when there is no game today or a watcher is already running.
    if: ${{ github.ref == 'refs/heads/main' && (github.event.schedule == '19 10 * * *' || github.event.schedule == '47 3 * * *') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write # to start the game-day watcher (workflow_dispatch)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scraper

      - name: Get the data files from the data branch
        run: python3 scraper/databranch.py fetch --remote origin

      - name: Start the game-day watcher if a game is played today
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scraper/watcher.py handoff --no-fetch

  build:
    # Every run that gets past the gate scrapes what its scope says (every sport, today's sport, or nothing for an
    # ordinary push), then renders. The check time is an uncommitted file (.checked-at): a run that reads pages
    # writes it and saves it to the Actions cache, and every run first restores the newest saved one, so a deploy
    # that read nothing still shows the time of the last real scrape (never its own time). A cache miss leaves
    # "Last checked" off the page. A GITHUB_TOKEN push does not start another run.
    # A full scrape waits 30 seconds between requests to each school's site (robots.txt), about 8 minutes.
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: update-and-deploy
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      problems: ${{ steps.summary.outputs.problems }}
      scrape: ${{ steps.summary.outputs.scrape }}
      commit: ${{ steps.summary.outputs.commit }}
      blocked: ${{ steps.summary.outputs.blocked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # the push and schedule triggers are already on main

      - name: Get the data files from the data branch
        run: python3 scraper/databranch.py fetch --remote origin

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install --require-hashes -r requirements.txt

      # series.json lives on the data branch but is the merge of the saved copies and the rulings (main), so a
      # change to a ruling or to the merge code makes it stale until it is rebuilt. This does it without
      # fetching. It may not stop the deploy: a ruling that finds nothing keeps that sport's last good data and
      # exits non-zero, as in a normal scrape, and the tests below say so if it matters.
      - name: Re-merge series.json from the saved copies
        id: remerge
        continue-on-error: true
        run: python scraper/scrape.py --remerge-only

      # Tests must pass before any source or publication step runs. Scraper failures remain tolerated
      # so validated fallback data can be published; the "report" job marks those runs red afterward,
      # as it does for an HTML validation problem.
      - name: Run tests
        id: tests
        run: python -m pytest -q tests

      # The newest check time saved by an earlier run on main (a run that reads pages replaces it below).
      - name: Restore the last check time
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .checked-at
          key: checked-at-${{ github.run_id }}
          restore-keys: checked-at-

      - name: Scrape
        id: scrape
        if: ${{ needs.gate.outputs.scope != '' }}
        continue-on-error: true
        env:
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
          APPLY_REVIEWED: ${{ inputs.apply_reviewed_changes }}
          SCOPE: ${{ needs.gate.outputs.scope }}
        run: |
          args="--blocked-file $RUNNER_TEMP/robots-blocked.txt"
          if [ "$SCOPE" != "all" ]; then args="$args --only $SCOPE"; fi
          if [ "$ALLOW_SHRINK" = "true" ]; then args="$args --allow-shrink"; fi
          if [ "$APPLY_REVIEWED" = "true" ]; then args="$args --apply-reviewed"; fi
          python scraper/scrape.py $args

      - name: Save the check time
        if: ${{ steps.scrape.outcome == 'success' || steps.scrape.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .checked-at
          key: checked-at-${{ github.run_id }}-${{ github.run_attempt }}

      # Render is a hard gate: if it fails the build stops here, before the data commit and the upload.
      - name: Render site
        run: python scraper/render.py

      # A rejected push to the data branch must not stop the deploy: the site is built from the data this run
      # just scraped, not from what is stored. A failure here only leaves the data branch stale, and the
      # Summarize step and the report job say so. test_data_commit commits only a marker file (no real data).
      - name: Commit if data changed
        id: commit
        continue-on-error: true
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          TEST_DATA_COMMIT: ${{ inputs.test_data_commit }}
        run: |
          args=""
          if [ "$TEST_DATA_COMMIT" = "true" ]; then args="--test-commit"; fi
          python3 scraper/databranch.py push --remote origin $args

      # include-hidden-files: the artifact step drops anything starting with a dot unless told otherwise, and
      # /.well-known/security.txt lives in a dot folder. A test pins the dot entries the site may contain.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          include-hidden-files: true

      # A run that read nothing (an ordinary push) skips the Scrape step: that is not a failure, but its re-merge
      # is then the only thing that made the data, so a failed re-merge counts as the scraper failing.
      - name: Summarize
        id: summary
        env:
          SCRAPE: ${{ steps.scrape.outcome }}
          REMERGE: ${{ steps.remerge.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          if [ "$SCRAPE" = "success" ]; then scrape=ok
          elif [ "$SCRAPE" = "skipped" ] && [ "$REMERGE" != "failure" ]; then scrape=skipped
          else scrape=failed
          fi
          blocked=""
          if [ -s "$RUNNER_TEMP/robots-blocked.txt" ]; then blocked=$(tr '\n' ' ' < "$RUNNER_TEMP/robots-blocked.txt"); fi
          if [ "$COMMIT" = "failure" ]; then commit=failed; else commit=ok; fi
          if [ "$scrape" != "failed" ] && [ "$commit" = "ok" ] && [ -z "$blocked" ]; then problems=false; else problems=true; fi
          if [ "$commit" = "failed" ]; then
            message="The data commit to the data branch failed, so the stored data was not updated. Publishing continues with the data this run scraped; review the Commit if data changed step logs and the Protect data ruleset."
            {
              echo "## Warning: the data commit failed"
              echo
              echo "$message"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Data commit::$message"
          fi
          {
            echo "problems=$problems"
            echo "scrape=$scrape"
            echo "commit=$commit"
            echo "blocked=$blocked"
          } >> "$GITHUB_OUTPUT"

  validate:
    # Checks the site the build job just made with html-validate, in a job that holds no write token and no
    # persisted credentials, so the npm packages it installs never run beside one. It reads the Pages artifact
    # the build job uploaded, installs the validator from package-lock.json with scripts off, and can never stop
    # publishing: deploy needs only the build job. A problem becomes a warning annotation, a run-summary note and
    # a red report job after the deploy. Every step that can fail is non-blocking, so this job itself succeeds.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      validation: ${{ steps.summary.outputs.validation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the generated site from the build job
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Unpack the site
        id: unpack
        if: ${{ steps.download.outcome == 'success' }}
        continue-on-error: true
        run: |
          mkdir site
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C site
          test -f site/index.html

      - name: Set up Node for HTML validation
        id: setup_node
        continue-on-error: true
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the HTML validator from the lockfile
        id: install
        if: ${{ steps.setup_node.outcome == 'success' }}
        continue-on-error: true
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check the title script syntax
        if: ${{ steps.setup_node.outcome == 'success' }}
        continue-on-error: true
        run: node --check static/easter-eggs.js

      - name: Validate generated HTML
        id: validate_html
        if: ${{ steps.setup_node.outcome == 'success' && steps.install.outcome == 'success' && steps.unpack.outcome == 'success' }}
        continue-on-error: true
        run: npx --no-install html-validate site/index.html site/404.html site/bell-heist/index.html site/heist-details/index.html site/privacy/index.html site/how-it-works/index.html site/how-it-works/athletics/index.html site/how-it-works/alumni/index.html site/alumni/index.html

      - name: Report HTML validation problem
        if: ${{ steps.validate_html.outcome != 'success' }}
        env:
          VALIDATE: ${{ steps.validate_html.outcome }}
          SETUP_NODE: ${{ steps.setup_node.outcome }}
          INSTALL: ${{ steps.install.outcome }}
        run: |
          if [ "$VALIDATE" = "failure" ]; then
            heading="Warning: generated HTML validation failed"
            message="The HTML validator found a problem. Publishing continues; review the Validate generated HTML step logs."
          elif [ "$SETUP_NODE" != "success" ]; then
            heading="Warning: HTML validation was skipped"
            message="HTML validation was skipped because Node could not be set up. Publishing continues; review the Set up Node for HTML validation step logs."
          elif [ "$INSTALL" != "success" ]; then
            heading="Warning: HTML validation was skipped"
            message="HTML validation was skipped because the validator could not be installed from the lockfile. Publishing continues; review the Install the HTML validator from the lockfile step logs."
          else
            heading="Warning: HTML validation was skipped"
            message="HTML validation was skipped because the generated site could not be fetched from the build job. Publishing continues; review the Get the generated site and Unpack the site step logs."
          fi
          {
            echo "## $heading"
            echo
            echo "$message"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=HTML validation::$message"

      - name: Summarize
        id: summary
        env:
          VALIDATE: ${{ steps.validate_html.outcome }}
        run: |
          if [ "$VALIDATE" = "success" ]; then validation=ok
          elif [ "$VALIDATE" = "failure" ]; then validation=failed
          else validation=skipped
          fi
          echo "validation=$validation" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  issues:
    # Keeps the data-review issue in step with pending-changes.json on the data branch (scraper/review_issue.py). It is
    # its own job so that only it holds issues: write, and it has its own concurrency group so two runs
    # can never open two issues at once.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: review-issue
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: |
            scraper

      - name: Get the data files from the data branch (after the build job's data commit)
        run: python3 scraper/databranch.py fetch --remote origin

      - name: Sync the data-review issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APPLIED: ${{ inputs.apply_reviewed_changes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=""
          if [ "$APPLIED" = "true" ]; then args="--applied"; fi
          python3 scraper/review_issue.py $args --run-url "$RUN_URL"

  report:
    # A failed test or render stops the build directly. This turns the run red after the deployment attempt for
    # the problems that do not stop publishing: a scraper failure, a page robots.txt now disallows (not requested,
    # last good data kept), HTML validation that failed or was skipped (or whose job did not finish), or a data
    # commit that was rejected.
    needs: [build, deploy, validate]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build.outputs.problems == 'true' || needs.validate.result != 'success' || needs.validate.outputs.validation != 'ok') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          SCRAPE: ${{ needs.build.outputs.scrape }}
          VALIDATION: ${{ needs.validate.outputs.validation }}
          VALIDATE_JOB: ${{ needs.validate.result }}
          COMMIT: ${{ needs.build.outputs.commit }}
          BLOCKED: ${{ needs.build.outputs.blocked }}
        run: |
          if [ "$SCRAPE" = "failed" ]; then
            echo "The scraper reported a failure. Check the Scrape step logs (on a run that read no pages, the Re-merge step) and the deployment result."
          fi
          if [ -n "$BLOCKED" ]; then
            echo "robots.txt now disallows pages the scraper needs, so they were not requested and their last good data is kept: $BLOCKED"
          fi
          if [ "$COMMIT" = "failed" ]; then
            echo "The data commit to the data branch failed, so the stored data is stale. It does not block publishing. Check the Commit if data changed step logs, the Protect data ruleset and the deployment result."
          fi
          if [ "$VALIDATION" = "failed" ]; then
            echo "HTML validation failed. It does not block publishing. Check the Validate generated HTML step logs in the validate job and the deployment result."
          elif [ "$VALIDATION" = "skipped" ]; then
            echo "HTML validation was skipped because Node, the validator or the generated site could not be set up. It does not block publishing. Check the validate job's step logs and the deployment result."
          elif [ "$VALIDATE_JOB" != "success" ]; then
            echo "HTML validation did not finish because the validate job did not complete. It does not block publishing. Check the validate job and the deployment result."
          fi
          exit 1
