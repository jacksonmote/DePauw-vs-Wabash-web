version: 2
updates:
  # requirements.in lists what the project needs; requirements.txt (generated by pip-compile, with hashes) is what
  # CI and production install. Dependabot updates requirements.txt (with hashes), and requirements.in too only when
  # the package is listed there (an indirect dependency such as soupsieve changes requirements.txt alone).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # package.json and package-lock.json lock the HTML validator CI runs on the generated pages.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
